name: CaffeineBar
options:
  bundleIdPrefix: com.elimanning
targets:
  CaffeineBar:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - Sources/Caffeine
      # xcodegen has no top-level `resources` key; a file only reaches the
      # bundle by being a source with an explicit resources build phase.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elimanning.caffeinebar
        PRODUCT_NAME: Caffeine Bar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6K4VZU48G9
        MARKETING_VERSION: "1.3.2"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
