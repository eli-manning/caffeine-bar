name: Release

# Fires on version tags only (e.g. `git tag v1.3.0 && git push --tags`) —
# ordinary pushes to main run CI but never publish a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the build (no leading v)'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  # Resolved once and shared, so the two builds can't disagree about what
  # version they're producing.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        # The tag is the source of truth for a tagged run; the manual input
        # covers workflow_dispatch, where there is no tag to read.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

  build-mac:
    needs: version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Check for a signing certificate
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        # An ad-hoc signature is not merely a Gatekeeper prompt here: on recent
        # macOS an ad-hoc signed app is silently denied a menu bar status item,
        # which is this app's entire interface. So the absence of a certificate
        # is a loud warning, not a footnote.
        run: |
          if [ -n "$CERT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERTIFICATE_P12 secret; the macOS build will be ad-hoc signed and may not get a menu bar icon on macOS 26+."
          fi

      - name: Import the signing certificate
        if: steps.signing.outputs.present == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Stamp the version
        # project.yml is the source of truth for the generated Xcode project,
        # and Info.plist carries the number users actually see, so both have to
        # match the tag or the release ships mislabelled.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          sed -i '' -E "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          grep -n "MARKETING_VERSION" project.yml

      - name: Build
        env:
          SIGNED: ${{ steps.signing.outputs.present }}
        run: |
          set -euo pipefail
          xcodegen generate
          if [ "$SIGNED" = "true" ]; then
            xcodebuild -project CaffeineBar.xcodeproj -scheme CaffeineBar \
              -configuration Release -derivedDataPath .build/xcode build
          else
            xcodebuild -project CaffeineBar.xcodeproj -scheme CaffeineBar \
              -configuration Release -derivedDataPath .build/xcode \
              CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" build
          fi

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          APP=".build/xcode/Build/Products/Release/Caffeine Bar.app"
          mkdir -p dist staging
          cp -R "$APP" staging/
          ditto -c -k --keepParent "staging/Caffeine Bar.app" "dist/Caffeine-Bar.zip"
          hdiutil create -volname "Caffeine Bar" -srcfolder staging \
            -ov -format UDZO "dist/Caffeine-Bar.dmg"

      - name: Verify the artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # Prove the packaged bundle is intact rather than trusting that hdiutil
        # exiting 0 means the app inside survived.
        run: |
          set -euo pipefail
          test -f dist/Caffeine-Bar.zip
          test -f dist/Caffeine-Bar.dmg
          MP=$(hdiutil attach dist/Caffeine-Bar.dmg -nobrowse -readonly | tail -1 | awk -F'\t' '{print $NF}')
          STAMPED=$(plutil -extract CFBundleShortVersionString raw "$MP/Caffeine Bar.app/Contents/Info.plist")
          test "$STAMPED" = "$VERSION"
          test -x "$MP/Caffeine Bar.app/Contents/MacOS/Caffeine Bar"
          ICON=$(plutil -extract CFBundleIconFile raw "$MP/Caffeine Bar.app/Contents/Info.plist")
          # CFBundleIconFile may legally omit the extension, and this one does.
          test -f "$MP/Caffeine Bar.app/Contents/Resources/$ICON" \
            || test -f "$MP/Caffeine Bar.app/Contents/Resources/$ICON.icns"
          # arm64 is what the Homebrew cask declares; a mismatched bundle would
          # install cleanly and then fail to launch.
          lipo -archs "$MP/Caffeine Bar.app/Contents/MacOS/Caffeine Bar" | grep -qw arm64
          hdiutil detach "$MP" -quiet
          echo "macOS artifacts OK (version $STAMPED)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Caffeine-Bar.zip
            dist/Caffeine-Bar.dmg
          if-no-files-found: error

  build-win:
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp the version
        working-directory: windows
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s|<Version>.*</Version>|<Version>$VERSION</Version>|" CaffeineBar.Windows.csproj
          sed -i -E "s|<FileVersion>.*</FileVersion>|<FileVersion>$VERSION.0</FileVersion>|" CaffeineBar.Windows.csproj
          sed -i -E "s|version=\"[0-9.]+\" name=\"CaffeineBar.app\"|version=\"$VERSION.0\" name=\"CaffeineBar.app\"|" app.manifest
          grep -n "<Version>\|<FileVersion>" CaffeineBar.Windows.csproj

      - name: Publish both architectures
        working-directory: windows
        shell: bash
        # Multi-file rather than single-file on purpose: a self-contained
        # single-file bundle unpacks itself at startup, which is structurally
        # what a packer looks like, and antivirus flags it far more often.
        run: |
          set -euo pipefail
          for rid in win-x64 win-arm64; do
            dotnet publish CaffeineBar.Windows.csproj \
              --configuration Release --runtime "$rid" --self-contained true \
              --output "installer/payload/$rid"
            test -f "installer/payload/$rid/CaffeineBar.exe"
            echo "published $rid"
          done

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        working-directory: windows/installer
        # PowerShell, not bash: MSYS rewrites any argument starting with "/"
        # into a Windows path, so /DAppVersion=... reached ISCC as a second
        # script filename and it refused to run.
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$env:VERSION" "CaffeineBar.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Verify the installer
        working-directory: windows/installer
        shell: bash
        # Both payloads are ~160 MB before compression, so anything under 40 MB
        # means one of the two Check-gated file sets silently matched nothing
        # and the installer would ship with no app inside it.
        run: |
          set -euo pipefail
          SETUP=dist/Caffeine-Bar-Setup.exe
          test -f "$SETUP"
          SIZE=$(stat -c%s "$SETUP")
          echo "installer is $SIZE bytes"
          test "$SIZE" -gt 40000000
          echo "installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/installer/dist/Caffeine-Bar-Setup.exe
          if-no-files-found: error

  # One job creates the release with every asset attached, so the two builds
  # run in parallel and neither races the other to create it.
  publish:
    needs: [version, build-mac, build-win]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List assets
        run: find artifacts -type f -print

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/macos/Caffeine-Bar.dmg
            artifacts/macos/Caffeine-Bar.zip
            artifacts/windows/Caffeine-Bar-Setup.exe

  # Point the Homebrew cask at the release that was just published. The cask
  # pins its download by hash, so without this `brew install` keeps handing
  # people the previous version indefinitely.
  #
  # Needs a TAP_DEPLOY_KEY secret — the private half of a write-enabled deploy
  # key on eli-manning/homebrew-tap, since GITHUB_TOKEN only reaches this repo.
  # A deploy key is preferred over a personal access token because it is scoped
  # to that one repository.
  bump-cask:
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Require the tap deploy key
        env:
          TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        # A hard failure, not a skip. This job used to no-op with a notice when
        # the credential was absent, which meant the release reported green
        # while `brew install` kept serving the previous version to every Mac
        # user. A release that doesn't update the thing people actually install
        # is a failed release and should look like one.
        run: |
          if [ -z "$TAP_KEY" ]; then
            echo "::error::TAP_DEPLOY_KEY is not set, so the Homebrew cask was not updated and 'brew install' still serves the previous version. Add the private half of a write-enabled deploy key for eli-manning/homebrew-tap at Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: macos

      # A deploy key rather than a personal access token: it grants write to
      # this one repository and nothing else on the account, and it doesn't
      # expire out from under the release.
      - uses: actions/checkout@v4
        with:
          repository: eli-manning/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          CASK=tap/Casks/caffeine-bar.rb

          # Hash whichever file the cask actually points at, rather than a name
          # hardcoded here. Renaming the release asset without updating the url
          # stanza previously left the cask 404ing on a file that no longer
          # existed, and a hardcoded name would have hidden that.
          ASSET=$(grep -oE 'releases/download/v#\{version\}/[^"]+' "$CASK" | sed 's|.*/||')
          echo "cask expects asset: $ASSET"
          if [ ! -f "macos/$ASSET" ]; then
            echo "::error::The cask's url points at '$ASSET', which this release does not produce. Update the url stanza in Casks/caffeine-bar.rb or rename the artifact."
            ls -la macos
            exit 1
          fi
          SHA=$(sha256sum "macos/$ASSET" | cut -d' ' -f1)

          # Anchored to the stanza names so this can't rewrite the sha256 of
          # some other cask, or a version inside a URL.
          sed -i -E "s|^  version \".*\"$|  version \"${VERSION}\"|" "$CASK"
          sed -i -E "s|^  sha256 \".*\"$|  sha256 \"${SHA}\"|" "$CASK"
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "sha256 \"${SHA}\"" "$CASK"
          cat "$CASK"

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git commit -am "caffeine-bar $VERSION"
          git push
